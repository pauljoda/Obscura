services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: builder
    command: pnpm --filter @obscura/web-svelte dev
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: postgresql://obscura:obscura@postgres:5432/obscura
      OBSCURA_CACHE_DIR: /data/cache
      OBSCURA_DATA_DIR: /data
    ports:
      - "5173:5173"
    depends_on:
      - postgres
    volumes:
      - cache-data:/data/cache

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      target: builder
    command: pnpm --filter @obscura/worker dev
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: postgresql://obscura:obscura@postgres:5432/obscura
      OBSCURA_CACHE_DIR: /data/cache
      OBSCURA_DATA_DIR: /data
    depends_on:
      - postgres
    volumes:
      - cache-data:/data/cache

  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /app
    command: dotnet watch --project apps/backend/src/Obscura.Api/Obscura.Api.csproj run --urls http://0.0.0.0:8008
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: postgresql://obscura:obscura@postgres:5432/obscura
      OBSCURA_CACHE_DIR: /data/cache
      OBSCURA_DATA_DIR: /data
    ports:
      - "8008:8008"
    depends_on:
      - postgres
    volumes:
      - ../..:/app
      - cache-data:/data/cache

  backend-worker:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /app
    command: dotnet watch --project apps/backend/src/Obscura.Worker/Obscura.Worker.csproj run
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DATABASE_URL: postgresql://obscura:obscura@postgres:5432/obscura
      OBSCURA_CACHE_DIR: /data/cache
      OBSCURA_DATA_DIR: /data
    depends_on:
      - postgres
    volumes:
      - ../..:/app
      - cache-data:/data/cache

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obscura
      POSTGRES_USER: obscura
      POSTGRES_PASSWORD: obscura
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  cache-data:
