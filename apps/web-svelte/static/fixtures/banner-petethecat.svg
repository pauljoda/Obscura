<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c830"/>
      <stop offset="80%" stop-color="#e8b830"/>
      <stop offset="100%" stop-color="#d8a828"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8c8"/>
      <stop offset="100%" stop-color="#5aafaf"/>
    </linearGradient>
  </defs>
  <!-- Background: wall and floor -->
  <rect width="1200" height="340" fill="url(#wall)"/>
  <rect y="340" width="1200" height="160" fill="url(#floor)"/>
  <!-- Wall trim -->
  <rect y="330" width="1200" height="20" fill="#5aafaf" opacity="0.4"/>
  <!-- Picture frames on wall -->
  <rect x="280" y="40" width="80" height="100" rx="40" fill="#c49060" stroke="#a07040" stroke-width="4"/>
  <rect x="295" y="55" width="50" height="70" rx="25" fill="#87ceeb"/>
  <rect x="700" y="30" width="100" height="100" fill="#608050" stroke="#507040" stroke-width="4"/>
  <rect x="714" y="44" width="72" height="72" fill="#e0d0a0"/>
  <!-- Duck character -->
  <ellipse cx="150" cy="360" rx="40" ry="55" fill="#b87830"/>
  <circle cx="150" cy="300" r="30" fill="#b87830"/>
  <ellipse cx="155" cy="295" rx="15" ry="16" fill="#fff"/>
  <circle cx="158" cy="293" r="8" fill="#1a1a1a"/>
  <ellipse cx="165" cy="310" rx="12" ry="6" fill="#e8a030"/>
  <ellipse cx="140" cy="280" rx="20" ry="12" fill="#d83070" transform="rotate(-15,140,280)"/>
  <!-- Frog character -->
  <ellipse cx="320" cy="370" rx="55" ry="60" fill="#7ab830"/>
  <circle cx="300" cy="300" r="18" fill="#fff"/>
  <circle cx="340" cy="300" r="18" fill="#fff"/>
  <circle cx="303" cy="302" r="9" fill="#1a1a1a"/>
  <circle cx="337" cy="302" r="9" fill="#1a1a1a"/>
  <path d="M310,330 Q320,340 330,330" fill="none" stroke="#4a7820" stroke-width="3"/>
  <!-- Squirrel character -->
  <ellipse cx="540" cy="390" rx="30" ry="40" fill="#9080b0"/>
  <circle cx="540" cy="350" r="22" fill="#9080b0"/>
  <circle cx="532" cy="345" r="10" fill="#fff"/>
  <circle cx="548" cy="345" r="10" fill="#fff"/>
  <circle cx="534" cy="346" r="5" fill="#1a1a1a"/>
  <circle cx="546" cy="346" r="5" fill="#1a1a1a"/>
  <ellipse cx="560" cy="370" rx="20" ry="35" fill="#a090c0" transform="rotate(20,560,370)"/>
  <!-- White cat (Callie) -->
  <ellipse cx="780" cy="370" rx="45" ry="60" fill="#f5e8e0"/>
  <circle cx="780" cy="300" r="35" fill="#f5e8e0"/>
  <polygon points="755,275 748,235 772,268" fill="#f5e8e0"/>
  <polygon points="805,275 812,235 788,268" fill="#f5e8e0"/>
  <polygon points="758,270 752,242 770,266" fill="#f0b0b0"/>
  <polygon points="802,270 808,242 790,266" fill="#f0b0b0"/>
  <ellipse cx="768" cy="298" rx="12" ry="13" fill="#87ceeb"/>
  <ellipse cx="792" cy="298" rx="12" ry="13" fill="#87ceeb"/>
  <circle cx="770" cy="300" r="6" fill="#1a1a1a"/>
  <circle cx="790" cy="300" r="6" fill="#1a1a1a"/>
  <ellipse cx="780" cy="315" rx="5" ry="3" fill="#f0a0a0"/>
  <!-- Pete the Cat (blue) -->
  <ellipse cx="1000" cy="365" rx="50" ry="65" fill="#3a7bd5"/>
  <circle cx="1000" cy="290" r="40" fill="#3a7bd5"/>
  <polygon points="970,260 960,210 985,252" fill="#3a7bd5"/>
  <polygon points="1030,260 1040,210 1015,252" fill="#3a7bd5"/>
  <polygon points="973,255 965,218 983,250" fill="#5a9be5"/>
  <polygon points="1027,255 1035,218 1017,250" fill="#5a9be5"/>
  <ellipse cx="985" cy="288" rx="14" ry="15" fill="#f5d442"/>
  <ellipse cx="1015" cy="288" rx="14" ry="15" fill="#f5d442"/>
  <circle cx="987" cy="290" r="7" fill="#1a1a1a"/>
  <circle cx="1013" cy="290" r="7" fill="#1a1a1a"/>
  <circle cx="984" cy="286" r="3" fill="#fff"/>
  <circle cx="1010" cy="286" r="3" fill="#fff"/>
  <polygon points="1000,305 995,312 1005,312" fill="#f5f5f5"/>
  <!-- Vinyl record Pete holds -->
  <circle cx="1060" cy="320" r="35" fill="#1a1a1a"/>
  <circle cx="1060" cy="320" r="12" fill="#e8b830"/>
  <circle cx="1060" cy="320" r="4" fill="#1a1a1a"/>
  <!-- Yellow record sleeve -->
  <rect x="1020" y="350" width="60" height="55" rx="3" fill="#e8b830"/>
  <circle cx="1040" cy="385" r="8" fill="#d83070"/>
</svg>
