<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5d442"/>
      <stop offset="70%" stop-color="#e8b830"/>
      <stop offset="100%" stop-color="#d4961e"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#2456a0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#glow)"/>
  <!-- Cat body -->
  <ellipse cx="200" cy="380" rx="100" ry="140" fill="url(#bodyGrad)"/>
  <!-- Cat head -->
  <circle cx="200" cy="220" r="90" fill="#3a7bd5"/>
  <!-- Ears -->
  <polygon points="130,160 145,80 175,150" fill="#3a7bd5"/>
  <polygon points="270,160 255,80 225,150" fill="#3a7bd5"/>
  <polygon points="138,150 150,95 170,148" fill="#5a9be5"/>
  <polygon points="262,150 250,95 230,148" fill="#5a9be5"/>
  <!-- Eyes -->
  <ellipse cx="168" cy="215" rx="28" ry="30" fill="#f5d442"/>
  <ellipse cx="232" cy="215" rx="28" ry="30" fill="#f5d442"/>
  <circle cx="168" cy="218" r="14" fill="#1a1a1a"/>
  <circle cx="232" cy="218" r="14" fill="#1a1a1a"/>
  <circle cx="163" cy="210" r="5" fill="#fff"/>
  <circle cx="227" cy="210" r="5" fill="#fff"/>
  <!-- Glasses -->
  <ellipse cx="168" cy="218" rx="36" ry="32" fill="none" stroke="#8b3a2a" stroke-width="5"/>
  <ellipse cx="232" cy="218" rx="36" ry="32" fill="none" stroke="#8b3a2a" stroke-width="5"/>
  <line x1="204" y1="215" x2="196" y2="215" stroke="#8b3a2a" stroke-width="4"/>
  <!-- Nose -->
  <polygon points="200,248 192,258 208,258" fill="#f5f5f5"/>
  <!-- Mouth -->
  <path d="M190,265 Q200,275 210,265" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Guitar neck -->
  <rect x="275" y="120" width="12" height="200" rx="4" fill="#8b5e3c" transform="rotate(25,280,220)"/>
  <!-- Guitar body -->
  <ellipse cx="310" cy="360" rx="40" ry="50" fill="#c4843a" transform="rotate(15,310,360)"/>
  <ellipse cx="310" cy="355" rx="18" ry="20" fill="#2a1a0a" transform="rotate(15,310,360)"/>
  <!-- Title text area -->
  <text x="200" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold" letter-spacing="3">PRIME ORIGINAL</text>
  <text x="200" y="115" text-anchor="middle" font-family="sans-serif" font-size="52" fill="#c0392b" font-weight="900">Pete</text>
  <text x="200" y="148" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#3a7bd5" font-weight="700">the</text>
  <text x="200" y="195" text-anchor="middle" font-family="sans-serif" font-size="52" fill="#c0392b" font-weight="900">Cat</text>
</svg>
